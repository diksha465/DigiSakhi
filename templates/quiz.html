
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | DigiSakhi</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
<header class="navbar">
    <a href="home.html" class="logo">DigiSakhi</a>
    <nav><a href="modules.html">Modules</a></nav>
</header>

<section class="form-box">
    <h1>Digital Skills Quiz</h1>

    <form action="results.html" method="get">
        <p><strong>1. Which device is used to type text?</strong></p>
        <label><input type="radio" name="q1" value="a" required> Monitor</label><br>
        <label><input type="radio" name="q1" value="b"> Keyboard</label><br>
        <label><input type="radio" name="q1" value="c"> Speaker</label><br>

        <p><strong>2. What should a strong password contain?</strong></p>
        <label><input type="radio" name="q2" value="a" required> Only your name</label><br>
        <label><input type="radio" name="q2" value="b"> 123456</label><br>
        <label><input type="radio" name="q2" value="c"> A mix of characters</label><br>

        <p><strong>3. What should you do with a suspicious link?</strong></p>
        <label><input type="radio" name="q3" value="a" required> Click it immediately</label><br>
        <label><input type="radio" name="q3" value="b"> Avoid it and verify the sender</label><br>
        <label><input type="radio" name="q3" value="c"> Share your password</label><br>

        <button type="submit" class="btn">Submit Quiz</button>
    </form>
</section>
</body>
</html>
